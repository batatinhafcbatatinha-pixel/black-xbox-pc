name: Setup.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    # The launcher (installer, Play, Dependencies, PC settings) built from tools/launcher: our own code only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Setup.exe
        run: dotnet build tools/launcher/Launcher.csproj -c Release -p:GameConfig=../../launcher.json -p:AssemblyName=Setup -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: dist/Setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [ -f RELEASE-NOTES.md ]; then notes=(--notes-file RELEASE-NOTES.md); fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${notes[@]}" --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
